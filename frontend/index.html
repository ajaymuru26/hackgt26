<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whiteboard Finisher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wall">
    <header class="top">
      <h1>Whiteboard Finisher</h1>
      <p class="hint">Write a problem like <strong>12 + 7 =</strong> or start a drawing, then pick what the robot should do.</p>
    </header>

    <div class="workspace">
    <div class="stage">
    <div class="frame">
      <canvas id="board" aria-label="Whiteboard drawing area"></canvas>
      <p id="empty" class="empty">Draw here</p>
    </div>

    <div class="tray" role="toolbar" aria-label="Whiteboard tools">
      <div class="tools">
        <button id="penBtn" class="tool is-on" aria-pressed="true" title="Marker (P)">
          <span class="cap cap-black" aria-hidden="true"></span>Marker
        </button>
        <button id="eraserBtn" class="tool" aria-pressed="false" title="Eraser (E)">
          <span class="cap cap-eraser" aria-hidden="true"></span>Eraser
        </button>
        <button id="textBtn" class="tool" aria-pressed="false" title="Ask (T): click the board, type a prompt, the robot writes the answer">
          <span class="cap cap-text" aria-hidden="true">?</span>Ask
        </button>
        <button id="imageBtn" class="tool" title="Upload a picture of a problem for the robot to solve">
          <span class="cap cap-image" aria-hidden="true"></span>Image
        </button>
        <input id="imageInput" type="file" accept="image/*" hidden>
        <button id="undoBtn" class="tool" title="Undo (Ctrl+Z)">Undo</button>
        <button id="clearBtn" class="tool" title="Clear the board">Clear</button>
        <button id="talkBtn" class="tool" aria-pressed="false" title="Talk: ElevenLabs hears you, then the robot draws what you said">
          Talk
        </button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div class="writer">
        <span class="writer-label">Ask tool:</span>
        <select id="askMode" aria-label="What the robot does with your prompt">
          <option value="answer" selected>Answer my prompt</option>
          <option value="exact">Write exactly what I type</option>
        </select>
        <select id="writeStyle" aria-label="Writing style">
          <option value="print">Print</option>
          <option value="cursive">Cursive</option>
        </select>
        <select id="writeSize" aria-label="Text size">
          <option value="30">Small</option>
          <option value="50" selected>Medium</option>
          <option value="80">Large</option>
        </select>

      </div>

      <div class="model-switch modes" role="group" aria-label="Which AI to ask">
        <span class="modes-label">Model</span>
        <button type="button" id="openaiBtn" class="mode is-on" aria-pressed="true">OpenAI</button>
        <button type="button" id="geminiBtn" class="mode" aria-pressed="false">Gemini</button>
      </div>

      <label class="writer drawing-note">
        <span class="writer-label">Fix the drawing</span>
        <input id="drawingNote" type="text" maxlength="400" placeholder="e.g. add a roof and a door on the house" aria-label="How the robot should change the drawing">
      </label>

      <div class="action-group" role="group" aria-label="What should the robot do">
        <button class="action finish" data-action="answer" title="Solve the maths, answer the question, or continue the pattern">
          <span class="cap cap-blue" aria-hidden="true"></span><span class="action-label">Answer</span>
        </button>
        <button class="action" data-action="work" title="Solve it and write the steps on the board, not only the final result">
          <span class="action-label">Answer but show work</span>
        </button>
        <button class="action" data-action="hint" title="A nudge toward the next step, without the answer">
          <span class="action-label">Hint</span>
        </button>
        <button class="action" data-action="check" title="Mark your answers right or wrong">
          <span class="action-label">Check my work</span>
        </button>
        <button class="action" data-action="drawing" title="Finish the picture on the board">
          <span class="action-label">Finish drawing</span>
        </button>
        <button class="action" data-action="cv" title="Finish an unfinished drawing with OpenCV: complete a partial circle, close a gap, or add a missing side. No AI call.">
          <span class="action-label">CV finish</span>
        </button>
        <label class="review-toggle" title="After the first version, the same five-item checklist runs at least twice. Each pass is listed in the thought process.">
          <input id="reviewToggle" type="checkbox" checked> Recheck at least twice
        </label>
      </div>

      <div class="actions">
        <label class="speed" for="speedSelect">Robot speed
          <select id="speedSelect">
            <option value="1">Real</option>
            <option value="2">2x</option>
            <option value="4" selected>4x</option>
            <option value="10">10x</option>
          </select>
        </label>
        <button id="replayBtn" class="tool" disabled title="Watch the robot draw again">Replay</button>
        <button id="gcodeBtn" class="tool" disabled title="Download the robot's lines as G-code">Download G-code</button>
      </div>

      <div class="saved">
        <p class="saved-label">Saved boards</p>
        <p id="savedEmpty" class="saved-empty">Finished boards are kept in MongoDB Atlas.</p>
        <ol id="savedList" class="saved-list"></ol>
      </div>
    </div>
    </div>

    <aside class="thoughts" aria-labelledby="thoughtsTitle">
      <div class="thoughts-head">
        <h2 id="thoughtsTitle">Thought process</h2>
        <p id="problemType" class="problem-type" hidden></p>
      </div>
      <p id="thoughtsEmpty" class="thoughts-empty">Press Finish it and the robot will explain each step it takes here.</p>
      <ol id="thoughtList" class="thought-list"></ol>
    </aside>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
